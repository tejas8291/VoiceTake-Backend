[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-take-api"
version = "0.1.0"
description = "Local narration and retake API for Voice Take"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "imageio-ffmpeg==0.8.1",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.22,<1",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx==0.6.1"]

[tool.setuptools.packages.find]
where = ["src"]
